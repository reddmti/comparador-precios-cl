# Obtiene los precios del día en las tres cadenas y los registra en la base remota.
#
# Corre una vez al día de madrugada en Chile (09:00 UTC = 06:00 en horario de
# invierno) y también puede lanzarse a mano desde la pestaña Actions.
#
# Requiere un único secreto en el repositorio: DATABASE_URL, con la misma cadena de
# conexión que usa la API.

name: Actualizar precios

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      consultas:
        description: "Consultas a obtener, separadas por espacio (vacío = todas)"
        required: false
        default: ""

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Comprobar el secreto DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Falla aquí, antes de media hora de extracción, y dice qué está mal. El error
          # que da SQLAlchemy más adelante («Could not parse SQLAlchemy URL») no permite
          # distinguir un secreto ausente de uno que incluye el prefijo DATABASE_URL=.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::El secreto DATABASE_URL no está definido en el repositorio."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgresql://*|postgresql+psycopg2://*|postgres://*) ;;
            *) echo "::error::DATABASE_URL no empieza por postgresql://. Debe contener solo la cadena de conexión, sin el prefijo 'DATABASE_URL='."
               exit 1 ;;
          esac

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Obtener y cargar los precios
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONSULTAS: ${{ github.event.inputs.consultas }}
        run: |
          if [ -z "$CONSULTAS" ]; then
            CONSULTAS="arroz fideos aceite azucar leche yogurt cafe te harina sal atun mayonesa mermelada galletas cereal detergente 'papel higienico' shampoo jabon 'pasta de dientes'"
          fi
          eval "python src/cargar.py --extraer $CONSULTAS"
